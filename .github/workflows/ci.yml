name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: deokhugam
          POSTGRES_USER: deokhugam_user
          POSTGRES_PASSWORD: deokhugam1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U deokhugam_user -d deokhugam"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/deokhugam
      DB_USERNAME: deokhugam_user
      DB_PASSWORD: deokhugam1234

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run tests and verify coverage
        run: ./gradlew clean check --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false